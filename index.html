<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Cadangan redirect otomatis dalam 3 detik jika JS mati -->
    <meta http-equiv="refresh" content="3;url=https://www.youtube.com/watch?v=MVGoix-ambE">
    <title>Mengalihkan ke YouTube...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h2>Sedang Mengalihkan ke YouTube...</h2>
        <p>Kamu akan diarahkan dalam <span id="countdown">3</span> detik.</p>
        <a id="manual-link" href="https://www.youtube.com/watch?v=MVGoix-ambE" class="btn">
            Klik di sini jika tidak berpindah otomatis
        </a>
    </div>

    <script src="script.js"></script>
</body>
</html>
